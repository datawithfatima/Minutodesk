<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1e22" />
    <title>MinutoDesk</title>
    <script>
      // Aplica el tema antes de pintar la página (evita un destello claro en modo oscuro).
      try {
        var t = localStorage.getItem("minutodesk_tema");
        if (t === "oscuro" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.dataset.tema = "oscuro";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
